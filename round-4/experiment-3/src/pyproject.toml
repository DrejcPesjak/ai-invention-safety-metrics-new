[project]
name = "gen-art-experiment-3"
version = "1.0.0"
description = "Does dequantizing bring the scar back? Two arms on the abliteration laundering ladder: the dequantization remedy (bit-width sweep, per-layer energy profile, W05rel) and error bars plus two new roots on the crossing table."
requires-python = ">=3.12"
# Every dependency is pinned to the EXACT version resolved in this workspace's .venv
# (`uv pip freeze`, mirrored verbatim in results/pip_freeze.txt).
#
# torch==2.6.0 is pinned DELIBERATELY, not incidentally: it is the version the
# iteration-3 archive used, so the reproduction gate compares like with like, and
# torch 2.13 routes an outer product through a Triton kernel that needs a C compiler
# absent from this container -- generation dies inside Runner.generate without it.
dependencies = [
    "accelerate==1.14.0",
    "annotated-doc==0.0.5",
    "anyio==4.14.2",
    "bitsandbytes==0.50.1",
    "certifi==2026.7.22",
