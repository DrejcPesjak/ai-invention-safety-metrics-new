[project]
name = "alpha50-steering"
version = "1.0.0"
description = "alpha_50 steering-strength safety metric vs the AMS diff-in-means baseline, on a 14-member / 4-lineage panel"
requires-python = "==3.12.*"
dependencies = [
    "accelerate==1.14.0",
    "annotated-doc==0.0.5",
    "anyio==4.14.2",
    "certifi==2026.7.22",
    "click==8.4.2",
    "cuda-bindings==12.9.7",
    "cuda-pathfinder==1.6.0",
    "cuda-toolkit==12.6.3",
    "filelock==3.32.3",
    "fsspec==2026.7.0",
    "h11==0.16.0",
    "hf-xet==1.6.0",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "huggingface-hub==1.27.0",
    "idna==3.18",
    "jinja2==3.1.6",
    "loguru==0.7.3",
    "markdown-it-py==4.2.0",
    "markupsafe==3.0.3",
    "mdurl==0.1.2",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.5.2",
    "nvidia-cublas-cu12==12.6.4.1",
    "nvidia-cuda-cupti-cu12==12.6.80",
    "nvidia-cuda-nvrtc-cu12==12.6.85",
    "nvidia-cuda-runtime-cu12==12.6.77",
    "nvidia-cudnn-cu12==9.10.2.21",
    "nvidia-cufft-cu12==11.3.0.4",
    "nvidia-cufile-cu12==1.11.1.6",
    "nvidia-curand-cu12==10.3.7.77",
    "nvidia-cusolver-cu12==11.7.1.2",
    "nvidia-cusparse-cu12==12.5.4.2",
    "nvidia-cusparselt-cu12==0.7.1",
    "nvidia-nccl-cu12==2.29.3",
    "nvidia-nvjitlink-cu12==12.6.85",
    "nvidia-nvshmem-cu12==3.4.5",
    "nvidia-nvtx-cu12==12.6.77",
    "packaging==26.3",
    "pandas==3.0.5",
    "psutil==7.2.2",
    "py-spy==0.4.2",
    "pygments==2.20.0",
    "python-dateutil==2.9.0.post0",
    "pyyaml==6.0.3",
    "regex==2026.7.19",
    "rich==15.0.0",
    "safetensors==0.8.0",
    "scipy==1.18.0",
    "setuptools==84.0.0",
    "shellingham==1.5.4",
    "six==1.17.0",
    "sympy==1.14.0",
    "tokenizers==0.22.2",
    "torch==2.13.0+cu126",
    "tqdm==4.70.0",
    "transformers==5.15.0",
    "triton==3.7.1",
    "typer==0.27.1",
    "typing-extensions==4.16.0",
]

# NOTE ON torch: the pin above carries the local version segment "+cu126" because that is
# the exact wheel installed - the CUDA 12.6 build. It does NOT resolve from the default
# PyPI index; install it the way this run did, which selects the same build automatically:
#     uv pip install torch --torch-backend=auto
# on a CUDA 12.6 host. The experiment ran on a single NVIDIA RTX A4500 (20 GB VRAM).
#
# NOTE ON gcc: a C compiler must be present. Triton JIT-compiles a CUDA utility module at
# first GPU use and fails hard without one (`apt-get install -y gcc`).

[tool.uv]
package = false
